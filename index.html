<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="language" content="EN">
    <meta id="keyWordsMetaTag" name="keywords">
    <meta id="copyRightMetaTag" name="copyright">
    <meta id="ownerMetaTag" name="owner">
    <meta id="descriptionMetaTag" name="description">
    <meta id="authorMetaTag" name="author">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name=msapplication-TileColor content=#2b5797>
    <meta name=theme-color content=#ffffff>
    <link rel="stylesheet" href="styles/pages/index.css">
    <script src="https://kit.fontawesome.com/1192cd116f.js" crossorigin="anonymous" defer></script>
    <script src="scripts/doms/layoutDom.js" defer></script>
    <script src="scripts/doms/indexDom.js" defer></script>
    <script src="scripts/variables/layoutVar.js" defer></script>
    <script src="scripts/variables/indexVar.js" defer></script>
    <script src="scripts/bases/function.js" defer></script>
    <script src="scripts/bases/layout.js" defer></script>
    <script src="scripts/pages/index.js" defer></script>
    <title>Main Page</title>
</head>
<body>
    <!-- Loading Element -->
    <div class="loading">
        <div class="reactor">
            <div class="triangle"></div>
            <div class="circle-1"><span></span><span></span><span></span><span></span></div>
            <div class="circle-2">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="circle-3"></div>
            <div class="circle-4"><span></span><span></span><span></span></div>
            <div class="circle-5"><span></span><span></span><span></span></div>
            <div class="circle-6"></div>
            <div class="circle-7"></div>
            <div class="circle-8"><span></span><span></span><span></span></div>
        </div>
    </div>
    <!-- Navigation -->
    <nav class="navigation">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="navigation__wrapper">
                        <div class="navigation__mobile-button">
                            <i class="navigation__mobile-icon fa-solid fa-bars"></i>
                        </div>
                        <H1 class="navigation__logo"><span class="navigation__logo-suffix"></span></H1>
                        <ul class="navigation__menu"></ul>
                        <div class="navigation__theme-button">
                            <i class="navigation__theme-icon fa-solid"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <!-- About Section -->
    <section class="about" id="aboutMe">
        <div class="container">
            <div class="row row--about">
                <div class="col-12 col-md-6">
                    <div class="about__content">
                        <H2 class="about__title">
                            <p>Hi, </p>
                            <p>My Friend</p>
                            <br>
                            <span>I Am </span>
                        </H2>
                        <div class="about__caption" data-time="4000" data-work-habits="Developer">
                            <p class="about__slogan"></p>
                            <p class="about__skills"></p>
                        </div>
                        <div class="about__buttons">
                            <a data-section-id="#skills" class="button button--skills">
                                <i class="button__icon fas fa-arrow-circle-right"></i>
                                <p class="button__title">Skills</p>
                            </a>
                            <a data-section-id="#project" class="button button--project">
                                <i class="button__icon fas fa-arrow-circle-right"></i>
                                <p class="button__title">Go To Projects</p>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="about__wrapper">
                        <div class="about__picture">
                            <img id="aboutImage" alt="" class="about__img">
                        </div>
                        <div class="about__social" data-speed="1000" data-time="2500">
                            <div class="social__wrapper"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Skills Section -->
    <section class="skills" id="skills">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="tab">
                        <span class="tab__mark">[</span>
                        <H3 class="tab__title">Skills</H3>
                        <span class="tab__mark">]</span>
                    </div>
                </div>
            </div>
            <div class="skills__wrapper" data-speed="1500" data-time="2500">
                <div class="row row--skills" id="rowSkills"></div>
            </div>
        </div>
    </section>
    <!-- Project Section -->
    <section class="project" id="project">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="tab">
                        <span class="tab__mark">{</span>
                        <H3 class="tab__title">Project</H3>
                        <span class="tab__mark">}</span>
                    </div>
                </div>
            </div>
            <div class="row" id="rowProject"></div>
            <div class="projectPagination" id="rowPagination" data-count-element-desktop="5" data-count-element-mobile="1" data-count-page="3"
                data-current-page="1"></div>
        </div>
    </section>
    <!-- Footer Section -->
    <section class="footer" id="contact">
        <div class="container">
            <div class="row row--footer">
                <div class="col-12 col-lg-6">
                    <div class="footer__content">
                        <H2 class="footer__title"></H2>
                        <p class="footer__caption"></p>
                    </div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="footer__contact">
                        <a class="footer__email">
                            <i class="fa-solid fa-envelope footer__email__icon"></i>
                            <p class="footer__email__txt"></p>
                        </a>
                        <a class="footer__sms">
                            <i class="fa-solid fa-message footer__sms__icon"></i>
                            <p class="footer__sms__txt"></p>
                        </a>
                    </div>
                </div>
                <div class="col-12">
                    <p class="footer__copy-right">Thank You For Your Visit &#128151;</p>
                </div>
            </div>
        </div>
    </section>
    <!-- Scroll Element -->
    <div class="scroll"></div>
    <!-- Cover Element -->
    <div class="cover"></div>
</body>
</html>
