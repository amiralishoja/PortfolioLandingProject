<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="language" content="EN">
    <meta name="keywords" content="amirali shoja, developer, front-end, java script, freelancer, remote work">
    <meta name="copyright" content="Amirali Shoja">
    <meta name="owner" content="Amirali Shoja">
    <meta name="description" content="A Programmer Who Loves Front End">
    <meta name="author" content="Amirali Shoja, amiralishoja.info@gmail.com, 09945792393">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="msapplication-TileColor" content="#2b5797">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="styles/pages/index.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <script src="scripts/doms/layoutDom.js" defer></script>
    <script src="scripts/doms/indexDom.js" defer></script>
    <script src="scripts/variables/layoutVar.js" defer></script>
    <script src="scripts/variables/indexVar.js" defer></script>
    <script src="scripts/bases/function.js" defer></script>
    <script src="scripts/bases/layout.js" defer></script>
    <script src="scripts/pages/index.js" defer></script>
    <title>Main Page</title>
</head>

<body>
    <!-- Loading Element -->
    <div class="loading"></div>
    <!-- Navigation -->
    <header class="header">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="navigation__wrapper">
                        <div class="navigation__mobile-button">
                            <i class="navigation__mobile-icon ri-menu-3-fill"></i>
                        </div>
                        <p class="navigation__logo"><span class="logo__suffix"></span></p>
                        <nav class="navigation__menu"></nav>
                        <div class="navigation__theme-button">
                            <i class="navigation__theme-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- About Section -->
    <section class="about" id="aboutMeSection">
        <div class="container">
            <div class="row row--about">
                <div class="col-12 col-md-6">
                    <div class="about__content">
                        <h1 class="about__title">
                            <span>Hey,</span>
                            <br>
                            <span>Dear Friend</span>
                            <br>
                            <span>I'm </span>
                        </h1>
                        <div class="about__caption" data-animation-time="4000" data-work-habits="coder">
                            <p class="about__slogan"></p>
                            <p class="about__skills animated"></p>
                        </div>
                        <div class="about__buttons">
                            <a href="#" class="button button--cv">
                                <i class="ri-arrow-down-circle-line button__icon"></i>
                                <p class="button__title">Resume</p>
                            </a>
                            <div class="about__social" data-animation-speed="1000" data-animation-time="2500">
                                <div class="social__wrapper"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6">
                    <div class="about__picture">
                        <img id="aboutImage" class="about__img">
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Skills Section -->
    <section class="skills" id="skillsSection">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="section-header">
                        <span class="section-header__mark">[</span>
                        <h3 class="section-header__title">Skills</h3>
                        <span class="section-header__mark">]</span>
                    </div>
                </div>
            </div>
            <div class="skills__wrapper" data-animation-speed="1500" data-animation-time="2500">
                <div class="row row--skills" id="rowSkills"></div>
            </div>
        </div>
    </section>
    <!-- Project Section -->
    <section class="project" id="projectSection">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="section-header">
                        <span class="section-header__mark">{</span>
                        <h3 class="section-header__title">Projects</h3>
                        <span class="section-header__mark">}</span>
                    </div>
                </div>
            </div>
            <div class="row" id="rowProject"></div>
            <div class="project-pagination" id="rowPagination" data-count-element-desktop="5"
                data-count-element-mobile="1" data-count-page="3" data-current-page="1"></div>
        </div>
    </section>
    <!-- Footer Section -->
    <footer class="footer" id="footerSection">
        <div class="container">
            <div class="row row--footer">
                <div class="col-12 col-lg-6">
                    <div class="footer__content">
                        <h2 class="footer__title"></h2>
                        <p class="footer__caption"></p>
                    </div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="footer__contact">
                        <a class="footer__email">
                            <i class="ri-mail-send-fill footer__email__icon"></i>
                            <p class="footer__email__txt"></p>
                        </a>
                    </div>
                </div>
                <div class="col-12">
                    <p class="footer__copy-right">Thanks For Your Visit &#128151;</p>
                </div>
            </div>
        </div>
    </footer>
    <!-- Scroll Element -->
    <div class="scroll"></div>
    <!-- Cover Element -->
    <div class="cover"></div>
</body>

</html>
