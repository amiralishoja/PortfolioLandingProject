<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="image/png" sizes="96x96" rel="icon" href="Images/Favicon.png">
    <link rel="stylesheet" href="Css/Page/Index.css">
    <script src="https://kit.fontawesome.com/1192cd116f.js" crossorigin="anonymous" defer></script>
    <script src="Scripts/Base/Dom.js" defer></script>
    <script src="Scripts/Base/Data.js" defer></script>
    <script src="Scripts/Base/Function.js" defer></script>
    <script src="Scripts/Base/Layout.js" defer></script>
    <script src="Scripts/Page/Index.js" defer></script>
    <title></title>
</head>

<body>
    <!-- Loading Element -->
    <div class="loading">
        <div class="reactor">
            <div class="triangle"></div>
            <div class="circle-1"><span></span><span></span><span></span><span></span></div>
            <div class="circle-2">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="circle-3"></div>
            <div class="circle-4"><span></span><span></span><span></span></div>
            <div class="circle-5"><span></span><span></span><span></span></div>
            <div class="circle-6"></div>
            <div class="circle-7"></div>
            <div class="circle-8"><span></span><span></span><span></span></div>
        </div>
    </div>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="row">
                <!-- The Navbar Wrapper Is Inside This Tag -->
                <div class="col-12">
                    <div class="navbar__wrapper">
                        <!-- Navbar Menu Mobile Button-->
                        <div class="navbar__mobileBtn">
                            <i class="navbar__mobileBtn__icon fa-solid fa-bars"></i>
                        </div>
                        <!-- Navbar Logo -->
                        <h1 class="navbar__logo"></h1>
                        <!-- Navbar Menu -->
                        <ul class="navbar__menu"></ul>
                        <!-- Navbar Theme Button -->
                        <div class="navbar__themeBtn">
                            <i class="navbar__themeBtn__icon fa-solid"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <!-- About Section -->
    <section class="about" id="aboutMe">
        <div class="container">
            <div class="row row--about">
                <!-- About Content Is Inside This Tag -->
                <div class="col-12 col-md-6">
                    <div class="about__content">
                        <!-- Fist Name And Last Name is Inside This Tag -->
                        <h2 class="about__title">
                            <p>Hi, </p>
                            <p>My Friend</p>
                            <br>
                            <span>I Am </span>
                        </h2>
                        <!-- Skills Are Displayed In This Tag -->
                        <div class="about__caption" data-time="4000" data-work-habits="Developer">
                            <p>A Programmer Who Loves Front End</p>
                            <p></p>
                        </div>
                        <!-- Quick Access Buttons Are Placed In This Tag -->
                        <div class="about__btns">
                            <a data-section-id="#skills" class="btn btn--skills">
                                <i class="btn__icon fas fa-arrow-circle-right"></i>
                                <p class="btn__title">Skills</p>
                            </a>
                            <a data-section-id="#project" class="btn btn--project">
                                <i class="btn__icon fas fa-arrow-circle-right"></i>
                                <p class="btn__title">Go To Projects</p>
                            </a>
                        </div>
                    </div>
                </div>
                <!-- About Picture Is Inside This Tag -->
                <div class="col-12 col-md-6">
                    <div class="about__wrapper">
                        <!-- The User's Photo Is Placed Inside This Tag -->
                        <div class="about__picture">
                            <img src="Images/About/Picture.webp" alt="AmiraliShoja" class="about__img">
                        </div>
                        <!-- The User's Virtual Networks Are Included In This Tag -->
                        <div class="about__social" data-speed="1000" data-time="2500">
                            <div class="social__wrapper"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Skills Section -->
    <section class="skills" id="skills">
        <div class="container">
            <!-- The Title Of The Section s Placed In This Tag -->
            <div class="row">
                <div class="col-12">
                    <div class="tab">
                        <span class="tab__mark">{</span>
                        <h3 class="tab__title">Skills</h3>
                        <span class="tab__mark">}</span>
                    </div>
                </div>
            </div>
            <!-- User Skills Are Placed In This Tag -->
            <div class="skills__wrapper" data-speed="1500" data-time="2500">
                <div class="row row--skills" id="rowSkills"></div>
            </div>
        </div>
    </section>
    <!-- Project Section -->
    <section class="project" id="project">
        <div class="container">
            <!-- The Title Of The Section s Placed In This Tag -->
            <div class="row">
                <div class="col-12">
                    <div class="tab">
                        <span class="tab__mark">[</span>
                        <h3 class="tab__title">Project</h3>
                        <span class="tab__mark">]</span>
                    </div>
                </div>
            </div>
            <!-- User Examples Are Placed In This Tag -->
            <div class="row" id="rowProject"></div>
            <div class="projectPages" id="projectPages" data-count-element="5" data-count-page="3" data-current-page="1"></div>
        </div>
    </section>
    <!-- Footer Section -->
    <section class="footer" id="contact">
        <div class="container">
            <div class="row">
                <!-- The Content Of The Footer Is Placed In This Tag -->
                <div class="col-12 col-lg-6">
                    <div class="footer__content">
                        <!-- The Title Of The Footer Content Is Placed In This Tag -->
                        <h2 class="footer__content__title"></h2>
                        <!-- The Description Of The Footer Content Is placed In This Tag -->
                        <p class="footer__content__caption"></p>
                    </div>
                </div>
                <!-- The Contact Of The Footer Is Placed In This Tag -->
                <div class="col-12 col-lg-6">
                    <div class="footer__contact">
                        <!-- The User's Email Is Placed In This Tag -->
                        <a class="footer__email">
                            <img src="Images/Icon/Email.png" alt="Email" class="footer__email__icon">
                            <p class="footer__email__txt"></p>
                        </a>
                        <!-- The User's Phone Is Placed In This Tag -->
                        <a class="footer__sms">
                            <img src="Images/Icon/Sms.png" alt="Sms" class="footer__sms__icon">
                            <p class="footer__sms__txt"></p>
                        </a>
                        <!-- The User's Virtual Networks Are Placed In This Tag -->
                        <div class="footer__social"></div>
                    </div>
                </div>
                <div class="col-12">
                    <!-- The Message Of Thanks And Copy Right Is Placed In This Tag -->
                    <p class="footer__txt">Thank You For Your Visit</p>
                </div>
            </div>
        </div>
    </section>
    <!-- Scroll Element -->
    <div class="scroll"></div>
    <!-- Cover Element -->
    <div class="cover"></div>
</body>

</html>
